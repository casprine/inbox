name: Inbox
options:
  bundleIdPrefix: com.casprine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
  Demo: release   # optimised and signed, for the phone: Debug builds make SwiftUI lists crawl on a device
settings:
  base:
    SWIFT_VERSION: "6.0"
  configs:
    Debug:
      # Debug builds are signed with the owner's Apple Development identity so they run on a phone (docs/RUN_ON_DEVICE.md).
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 2QG5WSN24S
    Demo:
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 2QG5WSN24S
    Release:
      # Release stays unsigned until the owner does the TestFlight steps in docs/STATE_IOS.md (CI archives unsigned).
      CODE_SIGNING_ALLOWED: "NO"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  Demo: Config/Demo.xcconfig
packages:
  InboxKit:
    path: InboxKit
targets:
  Inbox:
    type: application
    platform: iOS
    sources: [Inbox]
    info:
      path: Inbox/Info.plist
      properties:
        # Plain http to loopback / LAN hosts (the dev server on 127.0.0.1) without opening ATS globally.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        InboxDevAPIBaseURL: $(INBOX_DEV_API_BASE_URL)   # Debug only, from Local.xcconfig
        InboxDevToken: $(INBOX_DEV_TOKEN)               # Debug only, from Local.xcconfig
        InboxAPIBaseURL: $(INBOX_API_BASE_URL)   # the server's https URL, set at archive time (see docs/STATE_IOS.md)
        UIDesignRequiresCompatibility: true   # keep the flat bar buttons the design uses (no Liquid Glass capsules)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts: [OpenRunde-Regular.otf, OpenRunde-Medium.otf, OpenRunde-Semibold.otf, OpenRunde-Bold.otf]   # Open Runde, SIL OFL (Inbox/Fonts/OFL.txt)
        NSBonjourServices: ["_alfather._tcp"]
        NSLocalNetworkUsageDescription: Inbox looks for Alfather on your network to pair with it.
    dependencies:
      - package: InboxKit
        product: DesignSystem
      - package: InboxKit
        product: API
      - package: InboxKit
        product: Persistence
      - package: InboxKit
        product: Domain
      - package: InboxKit
        product: FeatureMail
      - package: InboxKit
        product: FeatureMessage
      - package: InboxKit
        product: FeatureSearch
      - package: InboxKit
        product: FeatureRules
      - package: InboxKit
        product: FeatureAttention
      - package: InboxKit
        product: FeatureGmail
      - package: InboxKit
        product: FeatureOnboarding
      - package: InboxKit
        product: FeatureBusinesses
      - package: InboxKit
        product: FeatureSettings
      - package: InboxKit
        product: Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casprine.inbox
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Inbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        INBOX_API_BASE_URL: ""   # override at archive time: xcodebuild … INBOX_API_BASE_URL=https://inbox.example.com
  InboxTests:
    type: bundle.unit-test
    platform: iOS
    sources: [InboxTests]
    dependencies:
      - target: Inbox
      - package: InboxKit
        product: DesignSystem
      - package: InboxKit
        product: API
      - package: InboxKit
        product: Persistence
      - package: InboxKit
        product: Domain
      - package: InboxKit
        product: FeatureMail
      - package: InboxKit
        product: FeatureMessage
      - package: InboxKit
        product: FeatureSearch
      - package: InboxKit
        product: FeatureRules
      - package: InboxKit
        product: FeatureAttention
      - package: InboxKit
        product: FeatureGmail
      - package: InboxKit
        product: FeatureOnboarding
      - package: InboxKit
        product: FeatureBusinesses
      - package: InboxKit
        product: FeatureSettings
      - package: InboxKit
        product: Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casprine.inbox.tests
        GENERATE_INFOPLIST_FILE: YES
  InboxLiveTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InboxLiveTests]
    dependencies:
      - target: Inbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casprine.inbox.livetests
        GENERATE_INFOPLIST_FILE: YES
  InboxUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [InboxUITests]
    dependencies:
      - target: Inbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.casprine.inbox.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Inbox:
    build:
      targets:
        Inbox: all
        InboxTests: [test]
        InboxUITests: [test]
        InboxLiveTests: [test]
    test:
      targets: [InboxTests, InboxUITests, InboxLiveTests]
  # Run this one on the phone: optimised build with the server URL and dev token from Local.xcconfig.
  Inbox Device:
    build:
      targets:
        Inbox: all
    run:
      config: Demo
